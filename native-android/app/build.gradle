plugins {
    id 'com.android.application'
}

android {
    namespace 'com.gabink.tamanbermain'
    compileSdk 34

    defaultConfig {
        applicationId "com.gabink.tamanbermain"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        buildConfigField "String", "APP_VERSION", "\"1.0.0\""
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
