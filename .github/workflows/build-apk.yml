name: Build Native Java APK & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set App Version & Prepare Native Assets
        id: ver
        run: |
          APP_VER="1.0.${{ github.run_number }}"
          echo "version=$APP_VER" >> $GITHUB_OUTPUT
          mkdir -p native-android/app/src/main/assets
          cp -r sfx-real suara-65 suara-75 suara-85 suara-100 native-android/app/src/main/assets/
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/" native-android/app/build.gradle
          sed -i "s/versionName \"1.0.0\"/versionName \"$APP_VER\"/" native-android/app/build.gradle
          sed -i "s/\"1.0.0\"/\"$APP_VER\"/" native-android/app/build.gradle

      - name: Build Native Debug APK
        working-directory: native-android
        run: |
          gradle assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../TamanBermainSiKecil-v${{ steps.ver.outputs.version }}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TamanBermainSiKecil-v${{ steps.ver.outputs.version }}.apk
          path: TamanBermainSiKecil-v${{ steps.ver.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Taman Bermain Si Kecil v${{ steps.ver.outputs.version }} (Native Java)
          body: |
            Build otomatis APK **Android Native Java** (tanpa WebView) **v${{ steps.ver.outputs.version }}**.
            Unduh file `.apk` di bawah untuk memasang atau memperbarui aplikasi di perangkat Android.
          files: TamanBermainSiKecil-v${{ steps.ver.outputs.version }}.apk
